<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-labelledby="title desc">
  <title id="title">Late-Share Secure-Aggregation Race and Session/Round Guard</title>
  <desc id="desc">Comparison of the unguarded LightSecAgg race where a delayed share from round N arrives during round N+1 and corrupts model scalars against wrong perturbation seeds, versus the fix in commit ce124b9 that checks session and round equality under the coordinator lock.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
  </defs>

  <rect width="1200" height="610" fill="#fcfbf8" />

  <!-- Header -->
  <text x="36" y="38" font-family="Instrument Sans, system-ui, sans-serif" font-size="20" font-weight="600" fill="#111315">Late-Share Secure-Aggregation Race &amp; Guard</text>
  <text x="36" y="62" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">LightSecAgg on the DeComFL scalar path · Commit ce124b9</text>

  <!-- LEFT PANEL: BEFORE -->
  <rect x="36" y="88" width="546" height="460" rx="6" fill="#fff9f9" stroke="#a23a3a" stroke-width="1.5" />
  <rect x="56" y="104" width="188" height="26" rx="6" fill="#a23a3a" />
  <text x="150" y="122" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#ffffff">BEFORE · UNGUARDED</text>
  <text x="258" y="122" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="600" fill="#a23a3a">Silent Numerical Corruption</text>

  <!-- Lifelines left -->
  <text x="145" y="160" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111315">Client A (delayed)</text>
  <line x1="145" y1="170" x2="145" y2="438" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="425" y="160" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111315">Coordinator</text>
  <line x1="425" y1="170" x2="425" y2="438" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Step 1 left -->
  <rect x="60" y="182" width="170" height="44" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="145" y="209" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">Sends Round N share</text>

  <!-- Step 2 left -->
  <rect x="315" y="222" width="225" height="54" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="427" y="244" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">Round N closes; Round N+1</text>
  <text x="427" y="264" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">starts with new seeds</text>

  <!-- Delayed arrow left -->
  <line x1="145" y1="226" x2="419" y2="332" stroke="#a23a3a" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="155" y="276" width="194" height="24" rx="6" fill="#fff9f9" stroke="#a23a3a" stroke-width="1" />
  <text x="252" y="293" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#a23a3a">Round N share arrives</text>

  <!-- Failure box left -->
  <rect x="296" y="336" width="264" height="94" rx="6" fill="#fdeeee" stroke="#a23a3a" stroke-width="1.5" />
  <text x="312" y="362" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#a23a3a">No round check → completes N+1</text>
  <text x="312" y="386" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">Applies Round N scalars against</text>
  <text x="312" y="408" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">Round N+1 perturbation seeds.</text>

  <!-- Verdict left -->
  <rect x="56" y="450" width="506" height="78" rx="6" fill="#ffffff" stroke="#a23a3a" stroke-width="1.5" />
  <text x="74" y="480" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#a23a3a">FAILURE: Model stays well-formed (passes shape checks)</text>
  <text x="74" y="504" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">but becomes numerically wrong — missed by unit tests.</text>

  <!-- RIGHT PANEL: AFTER -->
  <rect x="618" y="88" width="546" height="460" rx="6" fill="#f7fbf9" stroke="#207a52" stroke-width="1.5" />
  <rect x="638" y="104" width="176" height="26" rx="6" fill="#207a52" />
  <text x="726" y="122" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#ffffff">AFTER · ce124b9</text>
  <text x="828" y="122" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="600" fill="#207a52">Session / Round Guard</text>

  <!-- Lifelines right -->
  <text x="727" y="160" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111315">Client A (delayed)</text>
  <line x1="727" y1="170" x2="727" y2="438" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="1007" y="160" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111315">Coordinator (locked)</text>
  <line x1="1007" y1="170" x2="1007" y2="438" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Step 1 right -->
  <rect x="640" y="182" width="176" height="44" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="728" y="209" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111315">Share (session, N)</text>

  <!-- Step 2 right -->
  <rect x="897" y="222" width="225" height="54" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="1009" y="244" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111315">current_round = N+1</text>
  <text x="1009" y="264" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">active under coordinator lock</text>

  <!-- Delayed arrow right -->
  <line x1="727" y1="226" x2="1001" y2="332" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="737" y="276" width="194" height="24" rx="6" fill="#f7fbf9" stroke="#2457d6" stroke-width="1" />
  <text x="834" y="293" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">Round N share arrives</text>

  <!-- Guard box right -->
  <rect x="878" y="336" width="264" height="94" rx="6" fill="#ebf7f1" stroke="#207a52" stroke-width="1.5" />
  <text x="894" y="362" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#207a52">Guard under coordinator lock:</text>
  <text x="894" y="386" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111315">session &amp; round == current</text>
  <text x="894" y="408" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#207a52">N != N+1 → Drop stale share</text>

  <!-- Verdict right -->
  <rect x="638" y="450" width="506" height="78" rx="6" fill="#ffffff" stroke="#207a52" stroke-width="1.5" />
  <text x="656" y="480" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#207a52">CONFIRMED: Parameters unchanged, round does not advance</text>
  <text x="656" y="504" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">(delayed-share regression test + live gRPC comparison).</text>

  <!-- Scope footer -->
  <text x="36" y="582" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">
    <tspan font-weight="600" fill="#a23a3a">Scope limit (ce124b9):</tspan> The live masked vs. plaintext gRPC harness ran with 3 clients; larger cohorts, live dropout, and overhead are unmeasured.
  </text>
</svg>

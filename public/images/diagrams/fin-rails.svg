<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img">
  <title>Morgan Stanley Fraud Hub payment rail expansion (1 to 5 rails)</title>
  <desc>Platform growth at Morgan Stanley Fraud Hub during the EY engagement: expanded from 1 payment rail at join (P2P) to 5 payment rails (P2P, ACH, branch ACH, wire, branch wire).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#666b72" />
    </marker>
  </defs>

  <rect width="1200" height="360" fill="#fcfbf8" />

  <!-- Header -->
  <text x="36" y="42" font-family="Instrument Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111315">Morgan Stanley Fraud Hub — 1 to 5 payment rails (EY)</text>
  <text x="36" y="68" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" fill="#666b72">Confirmed platform expansion · pipeline changes delivered across intake, enrichment, rules, and persistence</text>

  <!-- At join card -->
  <rect x="36" y="102" width="248" height="176" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="56" y="132" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#666b72">AT JOIN · 1 RAIL</text>
  <rect x="56" y="154" width="208" height="96" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="74" y="192" font-family="Instrument Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111315">P2P</text>
  <text x="74" y="220" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Baseline rail at join</text>

  <!-- Expansion arrow -->
  <text x="339" y="176" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700" fill="#2457d6">1 → 5</text>
  <line x1="296" y1="190" x2="376" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Expanded card -->
  <rect x="388" y="102" width="776" height="176" rx="6" fill="#ffffff" stroke="#207a52" stroke-width="1.5" />
  <text x="408" y="132" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#207a52">EXPANDED PLATFORM · 5 PAYMENT RAILS (CONFIRMED)</text>

  <!-- 5 rails -->
  <rect x="408" y="154" width="136" height="96" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="424" y="192" font-family="Instrument Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111315">P2P</text>
  <text x="424" y="220" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Baseline</text>

  <rect x="558" y="154" width="136" height="96" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="1.5" />
  <text x="574" y="192" font-family="Instrument Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111315">ACH</text>
  <text x="574" y="220" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">+ added</text>

  <rect x="708" y="154" width="136" height="96" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="1.5" />
  <text x="724" y="192" font-family="Instrument Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111315">Branch ACH</text>
  <text x="724" y="220" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">+ added</text>

  <rect x="858" y="154" width="136" height="96" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="1.5" />
  <text x="874" y="192" font-family="Instrument Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111315">Wire</text>
  <text x="874" y="220" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">+ added</text>

  <rect x="1008" y="154" width="136" height="96" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="1.5" />
  <text x="1024" y="192" font-family="Instrument Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111315">Branch wire</text>
  <text x="1024" y="220" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">+ added</text>

  <!-- Footer -->
  <text x="36" y="324" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Scope: delivered rail changes across owned services (core enricher, additional enricher, persistence) and teammate services, with design docs.</text>
</svg>

  <line x1="40" y1="518" x2="1160" y2="518" stroke="#d8d6d0" stroke-width="1.5" />
  <rect x="40" y="536" width="14" height="14" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="62" y="548" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Core ML &amp; panel pipeline</text>
  <rect x="256" y="536" width="14" height="14" rx="6" fill="#fcfbf8" stroke="#207a52" stroke-width="1.5" />

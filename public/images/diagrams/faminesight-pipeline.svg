  <line x1="264" y1="308" x2="302" y2="308" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="520" y1="260" x2="558" y2="210" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img">
  <title>Morgan Stanley Fraud Hub Real-Time Screening Pipeline (EY)</title>
  <desc>Pipeline diagram for Morgan Stanley Fraud Hub: transactions across five payment rails arrive over IBM MQ, enter the orchestrator where the SLA clock starts and the inbound transaction is cached in Redis, flow over Kafka through the owned core enricher, rule-based decision engine, optional owned additional enricher looping back to the decision engine, and owned persistence service which reads Redis, writes the final NoSQL record, and stops the SLA clock. Suspected cases route to automated triage queues.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#666b72" />
    </marker>
  </defs>

  <rect width="1200" height="590" fill="#fcfbf8" />

  <!-- Header -->
  <text x="24" y="40" font-family="Instrument Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111315">Morgan Stanley Fraud Hub — real-time screening pipeline (EY)</text>
  <text x="24" y="66" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" fill="#666b72">~8 services total (5 recalled by name, 3 owned) · Scala / Java · Kafka passes the fraud domain object between services</text>

  <!-- Redis cache (top bypass path) -->
  <rect x="448" y="92" width="444" height="68" rx="6" fill="#edf7f1" stroke="#207a52" stroke-width="1.5" />
  <text x="466" y="120" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600" fill="#207a52">Redis</text>
  <text x="530" y="120" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111315">Inbound transaction cache</text>
  <text x="466" y="144" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#207a52">Takes DB round-trips off SLA path (5,000 ms → &lt; 500 ms)</text>

  <!-- Payment rails -->
  <rect x="24" y="206" width="152" height="114" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="38" y="236" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111315">Payment rails</text>
  <text x="38" y="262" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">P2P · ACH · wire</text>
  <text x="38" y="284" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">branch ACH</text>
  <text x="38" y="304" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">branch wire</text>

  <line x1="176" y1="263" x2="194" y2="263" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- IBM MQ -->
  <rect x="198" y="220" width="76" height="86" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="210" y="258" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#111315">IBM MQ</text>
  <text x="214" y="282" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Intake</text>

  <line x1="274" y1="263" x2="292" y2="263" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Orchestrator -->
  <rect x="296" y="206" width="144" height="114" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="312" y="236" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111315">Orchestrator</text>
  <text x="312" y="264" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#207a52">SLA START</text>
  <text x="312" y="290" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Drives pipeline</text>

  <!-- Orchestrator -> Redis -->
  <path d="M 368 206 L 368 126 L 442 126" fill="none" stroke="#207a52" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="376" y="116" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#207a52">cache txn</text>

  <line x1="440" y1="263" x2="464" y2="263" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Core enricher [owned] -->
  <rect x="468" y="206" width="146" height="114" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="2" />
  <text x="484" y="232" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#2457d6">[owned]</text>
  <text x="484" y="258" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111315">Core enricher</text>
  <text x="484" y="284" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Builds fraud</text>
  <text x="484" y="304" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">domain object</text>

  <line x1="614" y1="263" x2="638" y2="263" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision engine -->
  <rect x="642" y="206" width="150" height="114" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="656" y="236" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111315">Decision engine</text>
  <text x="656" y="264" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Rule-based</text>
  <text x="656" y="286" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Fraud / clean /</text>
  <text x="656" y="306" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">suspected</text>

  <line x1="792" y1="263" x2="816" y2="263" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Persistence [owned] -->
  <rect x="820" y="206" width="142" height="114" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="2" />
  <text x="836" y="232" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#2457d6">[owned]</text>
  <text x="836" y="258" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#111315">Persistence</text>
  <text x="836" y="286" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#207a52">SLA STOP</text>
  <text x="836" y="308" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Final record</text>

  <!-- Redis -> Persistence -->
  <path d="M 892 126 L 932 126 L 932 200" fill="none" stroke="#207a52" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="942" y="142" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#207a52">read in memory</text>

  <line x1="962" y1="263" x2="984" y2="263" stroke="#a66112" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Triage queues -->
  <rect x="990" y="200" width="186" height="126" rx="6" fill="#fdf5ea" stroke="#a66112" stroke-width="1.5" />
  <text x="1004" y="228" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#a66112">Triage queues</text>
  <text x="1004" y="254" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">Suspected cases</text>
  <text x="1004" y="276" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Auto-route · pre-filled</text>
  <text x="1004" y="298" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Auto-clear low risk</text>
  <text x="1004" y="318" font-family="IBM Plex Mono, monospace" font-size="14" fill="#a66112">−75% review time</text>

  <!-- Kafka label band between Orchestrator and Persistence -->
  <line x1="440" y1="184" x2="820" y2="184" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="630" y="177" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">Kafka between services</text>

  <!-- External services below Core enricher -->
  <line x1="541" y1="320" x2="541" y2="386" stroke="#666b72" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="460" y="392" width="162" height="74" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="476" y="422" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#111315">External services</text>
  <text x="476" y="446" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Risk &amp; reference</text>

  <!-- Additional enricher [owned] below Decision engine with loop back -->
  <line x1="686" y1="320" x2="686" y2="386" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="678" y="362" text-anchor="end" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">needs context</text>

  <line x1="744" y1="392" x2="744" y2="326" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="754" y="362" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#2457d6">back to decision</text>

  <rect x="636" y="392" width="166" height="96" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="2" />
  <text x="652" y="418" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#2457d6">[owned]</text>
  <text x="652" y="444" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#111315">Additional enricher</text>
  <text x="652" y="468" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">2nd enrichment pass</text>

  <!-- NoSQL store below Persistence -->
  <line x1="891" y1="320" x2="891" y2="386" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="820" y="392" width="142" height="74" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="836" y="422" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#111315">NoSQL store</text>
  <text x="836" y="446" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Final record</text>

  <!-- Legend -->
  <rect x="24" y="534" width="16" height="16" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="2" />
  <text x="48" y="547" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">Owned by Anurag (3 of ~8 services)</text>

  <rect x="310" y="534" width="16" height="16" rx="6" fill="#edf7f1" stroke="#207a52" stroke-width="1.5" />
  <text x="334" y="547" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#207a52">Confirmed SLA path &amp; Redis cache</text>

  <rect x="598" y="534" width="16" height="16" rx="6" fill="#fdf5ea" stroke="#a66112" stroke-width="1.5" />
  <text x="622" y="547" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#a66112">Reported triage impact (contributed)</text>
</svg>

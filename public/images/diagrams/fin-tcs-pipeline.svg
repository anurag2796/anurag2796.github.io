<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img">
  <title>USAA Consumer Lending 6-Service Pipeline (TCS)</title>
  <desc>Architecture flow of USAA Consumer Lending at TCS: thin personal and auto loan applications arrive on IBM MQ and pass through six Spring Boot services (descriptive names: intake, context retrieval, credit retrieval, risk check, decision, data/publish). External other-team calls include credit-card service, LDAP directory, and credit-bureau gateway. Repeated failures route to an MQ backout queue for replay. Final records persist first to MySQL and Couchbase, then publish to a Kafka topic for downstream teams.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#666b72" />
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#fcfbf8" />

  <!-- Header -->
  <text x="36" y="42" font-family="Instrument Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111315">USAA Consumer Lending — 6-service Spring Boot pipeline (TCS)</text>
  <text x="36" y="68" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" fill="#666b72">Personal &amp; auto loans · one repository per service · service names are descriptive by function</text>

  <!-- IBM MQ Intake -->
  <rect x="36" y="138" width="144" height="114" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="52" y="170" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600" fill="#111315">IBM MQ</text>
  <text x="52" y="196" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Request queue</text>
  <text x="52" y="218" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Thin loan request</text>
  <text x="52" y="238" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">(other team in)</text>

  <line x1="180" y1="195" x2="210" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Service 1: Intake -->
  <rect x="216" y="138" width="206" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="232" y="168" font-family="Instrument Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111315">1. Intake</text>
  <text x="232" y="194" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Consume &amp; validate</text>
  <text x="232" y="216" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Open tracked record</text>
  <text x="232" y="238" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">descriptive name</text>

  <line x1="422" y1="195" x2="450" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Service 2: Context retrieval -->
  <rect x="456" y="138" width="256" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="472" y="168" font-family="Instrument Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111315">2. Context retrieval</text>
  <text x="472" y="194" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Member, accounts, geo (via ⑥)</text>
  <text x="472" y="216" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Card &amp; loan-officer lookups</text>
  <text x="472" y="238" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">descriptive name</text>

  <line x1="712" y1="195" x2="740" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Service 3: Credit retrieval -->
  <rect x="746" y="138" width="224" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="762" y="168" font-family="Instrument Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111315">3. Credit retrieval</text>
  <text x="762" y="194" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Bureau score &amp; attributes</text>
  <text x="762" y="216" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">Timeouts + retries</text>
  <text x="762" y="238" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">descriptive name</text>

  <!-- MQ Backout Queue -->
  <line x1="319" y1="252" x2="319" y2="288" stroke="#a23a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="216" y="294" width="206" height="78" rx="6" fill="#fbeeee" stroke="#a23a3a" stroke-width="1.5" />
  <text x="232" y="324" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#a23a3a">MQ backout queue</text>
  <text x="232" y="348" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#a23a3a">Failed messages · replay</text>

  <!-- Other-team calls under Service 2 -->
  <line x1="516" y1="252" x2="516" y2="288" stroke="#666b72" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="444" y="294" width="144" height="78" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="456" y="324" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111315">Credit-card svc</text>
  <text x="456" y="348" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">REST · other team</text>

  <line x1="664" y1="252" x2="664" y2="288" stroke="#666b72" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="598" y="294" width="136" height="78" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="610" y="324" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111315">LDAP directory</text>
  <text x="610" y="348" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Staff · other team</text>

  <!-- Other-team call under Service 3 -->
  <line x1="858" y1="252" x2="858" y2="288" stroke="#666b72" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <rect x="746" y="294" width="224" height="78" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="762" y="324" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#111315">Credit-bureau gateway</text>
  <text x="762" y="348" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">REST · other team</text>

  <!-- Return path from Service 3 to Service 4 -->
  <path d="M 970 195 L 1016 195 L 1016 396 L 319 396 L 319 422" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Service 4: Risk check -->
  <rect x="216" y="428" width="206" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="232" y="458" font-family="Instrument Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111315">4. Risk check</text>
  <text x="232" y="484" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Security risk signals</text>
  <text x="232" y="506" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Financial risk checks</text>
  <text x="232" y="528" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">descriptive name</text>

  <line x1="422" y1="485" x2="450" y2="485" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Service 5: Decision -->
  <rect x="456" y="428" width="256" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="472" y="458" font-family="Instrument Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111315">5. Decision</text>
  <text x="472" y="484" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Java rules + bureau score</text>
  <text x="472" y="506" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#207a52">Approve · review · risk flag</text>
  <text x="472" y="528" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">descriptive name</text>

  <line x1="712" y1="485" x2="740" y2="485" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Service 6: Data / publish -->
  <rect x="746" y="428" width="224" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="762" y="458" font-family="Instrument Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111315">6. Data / publish</text>
  <text x="762" y="484" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Persist first, then publish</text>
  <text x="762" y="506" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Reads for ② · writes ①–⑤</text>
  <text x="762" y="528" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">descriptive name</text>

  <line x1="970" y1="485" x2="996" y2="485" stroke="#207a52" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Kafka Topic Out -->
  <rect x="1002" y="428" width="166" height="114" rx="6" fill="#edf7f1" stroke="#207a52" stroke-width="1.5" />
  <text x="1018" y="460" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600" fill="#111315">Kafka topic</text>
  <text x="1018" y="486" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#207a52">Final record out</text>
  <text x="1018" y="508" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Downstream teams</text>
  <text x="1018" y="528" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">(other teams)</text>

  <!-- MySQL + Couchbase -->
  <line x1="810" y1="542" x2="736" y2="572" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="904" y1="542" x2="904" y2="572" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="616" y="576" width="180" height="64" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="632" y="604" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#111315">MySQL</text>
  <text x="632" y="626" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">System of record</text>

  <rect x="812" y="576" width="194" height="64" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="828" y="604" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#111315">Couchbase</text>
  <text x="828" y="626" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">JSON docs by key</text>

  <!-- Legend -->
  <rect x="36" y="592" width="16" height="16" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="60" y="605" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">6 team-owned Spring Boot services (descriptive labels)</text>

  <rect x="36" y="620" width="16" height="16" rx="6" fill="#f5f3ee" stroke="#d8d6d0" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="60" y="633" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Other-team calls</text>

  <rect x="200" y="620" width="16" height="16" rx="6" fill="#fbeeee" stroke="#a23a3a" stroke-width="1.5" />
  <text x="224" y="633" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#a23a3a">Failure / backout replay</text>
</svg>

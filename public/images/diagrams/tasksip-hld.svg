  <text x="442" y="416" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#111315">5s periodic + chunk checks (CLI &amp; SSE)</text>
  <text x="442" y="440" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Aborts upstream on revoke; emits terminal</text>
  <text x="442" y="462" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">event · Heuristic interrupted metering</text>

  <rect x="426" y="504" width="410" height="84" rx="6" fill="#f0f5ff" stroke="#2457d6" stroke-width="2" />
  <text x="442" y="530" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2457d6">DB &amp; Reconciled Migrations</text>
  <text x="820" y="530" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="#2457d6">ANURAG</text>
  <text x="442" y="556" font-family="IBM Plex Mono, monospace" font-size="14" fill="#111315">PostgreSQL / SQLite · Alembic 0022</text>
  <text x="442" y="576" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Merged overlapping lineages · GCS preconditions</text>


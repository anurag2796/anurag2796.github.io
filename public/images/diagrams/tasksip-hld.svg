<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="tasksip-title tasksip-desc">
  <title id="tasksip-title">TaskSip System Architecture Highlighting Anurag's Components</title>
  <desc id="tasksip-desc">Full-system high-level architecture of TaskSip showing teammate-built components in muted gray and Anurag's contributions highlighted in blue. Teammate-built components (ZidongLiu and xiaxin) cover the browser React workspace, core CLI gateway proxy, protocol translation, pooled routing, document ingestion, team conversations, Cloud Run agent jobs, and cost reporting. Anurag's highlighted components cover the Tauri 2 Rust desktop app (v0.3.1), local Code sessions runner with Windows Job Objects and macOS descendant tracking, opt-in routing switch with selective Undo, database-backed workspace-wide rate limit and send-time IP SSRF protection, in-flight stream revocation with heuristic metering, and reconciled Alembic migrations. A local verification note lists 95 backend and 253 frontend tests passed at commit fcc4df7.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#666b72" />
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#fcfbf8" />

  <!-- Header -->
  <text x="36" y="34" font-family="Instrument Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111315">TaskSip — Full System Architecture (Ownership Highlighted)</text>
  <text x="36" y="58" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Blue = Anurag's scope (Nov 2–20, 2026) · Neutral = Teammate-built gateway core &amp; workspace (ZidongLiu, xiaxin)</text>


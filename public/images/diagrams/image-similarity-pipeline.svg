<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="imgsim-title imgsim-desc">
  <title id="imgsim-title">imageSimilarity dual-branch TinyImageNet verification pipeline</title>
  <desc id="imgsim-desc">Balanced same-category and different-category image pairs from TinyImageNet via Hugging Face datasets feed two parallel verification pipelines: a frozen DINOv2 backbone with a trained Linear-Dropout-Linear similarity head under binary cross-entropy loss, and a fine-tuned CLIP vision encoder with classification objective and a validation-tuned cosine-distance threshold applied to test pairs. Both run through a unified CLI with MPS to CUDA to CPU fallback; no evaluation metrics are committed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#666b72" />
    </marker>
  </defs>

  <rect width="1200" height="500" fill="#fcfbf8" />

  <!-- Header -->
  <text x="40" y="48" font-family="Instrument Sans, system-ui, sans-serif" font-size="22" font-weight="600" fill="#111315">imageSimilarity — Pairwise Representation Comparison</text>
  <text x="40" y="74" font-family="IBM Plex Mono, monospace" font-size="14" fill="#666b72">representation learning · not generative AI · ~830 lines Python</text>

  <rect x="886" y="28" width="274" height="32" rx="6" fill="#fcfbf8" stroke="#a23a3a" stroke-width="1.5" />
  <text x="1023" y="49" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#a23a3a">NO COMMITTED METRICS</text>

  <!-- Col 1: TinyImageNet Pairs -->
  <text x="40" y="114" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#666b72">01 · INPUT PAIRS</text>
  <rect x="40" y="130" width="224" height="270" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="58" y="164" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="500" fill="#111315">TinyImageNet</text>
  <text x="58" y="188" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Hugging Face datasets</text>

  <line x1="58" y1="208" x2="246" y2="208" stroke="#d8d6d0" stroke-width="1.5" />

  <text x="58" y="238" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111315">Balanced Pair Gen</text>
  <text x="58" y="264" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">• Same-class (+)</text>
  <text x="58" y="288" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">• Different-class (-)</text>
  <text x="58" y="324" font-family="IBM Plex Mono, monospace" font-size="14" fill="#666b72">num_workers=0 (macOS)</text>
  <text x="58" y="352" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#a66112">&gt;=2 classes, &gt;=2 imgs</text>
  <text x="58" y="374" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#a66112">Dry runs can unbalance</text>

  <!-- Branch A: Frozen DINOv2 + Trained Head -->
  <text x="308" y="114" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#2457d6">02A · DINOv2 PIPELINE (--mode dino)</text>
  <rect x="308" y="130" width="600" height="122" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />

  <rect x="324" y="150" width="170" height="82" rx="6" fill="#fcfbf8" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="409" y="180" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="500" fill="#111315">Frozen DINOv2</text>
  <text x="409" y="204" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Feature extractor</text>

  <rect x="524" y="150" width="186" height="82" rx="6" fill="#fcfbf8" stroke="#2457d6" stroke-width="1.5" />
  <text x="617" y="176" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111315">Trained Head</text>
  <text x="617" y="198" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">Lin-&gt;Drop-&gt;Lin</text>
  <text x="617" y="218" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#666b72">BCE loss</text>

  <rect x="740" y="150" width="152" height="82" rx="6" fill="#fcfbf8" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="816" y="180" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111315">Pair Score</text>
  <text x="816" y="204" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Trained classifier</text>

  <line x1="494" y1="191" x2="522" y2="191" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="710" y1="191" x2="738" y2="191" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Branch B: Fine-tuned CLIP + Tuned Threshold -->
  <text x="308" y="274" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#2457d6">02B · CLIP PIPELINE (--mode clip)</text>
  <rect x="308" y="286" width="600" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />

  <rect x="324" y="302" width="170" height="82" rx="6" fill="#fcfbf8" stroke="#2457d6" stroke-width="1.5" />
  <text x="409" y="330" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="500" fill="#111315">Fine-tuned CLIP</text>
  <text x="409" y="352" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Vision encoder</text>
  <text x="409" y="372" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">(classification obj.)</text>

  <rect x="524" y="302" width="186" height="82" rx="6" fill="#fcfbf8" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="617" y="332" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#111315">Cosine Distance</text>
  <text x="617" y="356" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Pairwise embeddings</text>

  <rect x="740" y="302" width="152" height="82" rx="6" fill="#fcfbf8" stroke="#207a52" stroke-width="1.5" />
  <text x="816" y="330" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#207a52">Tuned Threshold</text>
  <text x="816" y="352" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Fit on val split,</text>
  <text x="816" y="372" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">applied to test</text>

  <line x1="494" y1="343" x2="522" y2="343" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="710" y1="343" x2="738" y2="343" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Col 3: CLI & Artifacts -->
  <text x="948" y="114" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="#666b72">03 · RUNNER &amp; OUTPUT</text>
  <rect x="948" y="130" width="212" height="270" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5" />
  <text x="966" y="164" font-family="Instrument Sans, system-ui, sans-serif" font-size="16" font-weight="600" fill="#111315">Shared CLI</text>
  <text x="966" y="188" font-family="IBM Plex Mono, monospace" font-size="14" fill="#2457d6">dino | clip | all</text>
  <text x="966" y="218" font-family="IBM Plex Mono, monospace" font-size="14" fill="#666b72">MPS -&gt; CUDA -&gt; CPU</text>
  <text x="966" y="246" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Loss &amp; threshold</text>
  <text x="966" y="266" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">plots + unit tests</text>

  <rect x="964" y="304" width="180" height="78" rx="6" fill="#fcfbf8" stroke="#a23a3a" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="1054" y="336" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#a23a3a">No accuracy / ROC</text>
  <text x="1054" y="358" text-anchor="middle" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#a23a3a">scores committed</text>

  <!-- Cross-column Arrows -->
  <line x1="264" y1="220" x2="306" y2="195" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="264" y1="305" x2="306" y2="335" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="908" y1="191" x2="946" y2="215" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="908" y1="343" x2="946" y2="310" stroke="#666b72" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Footer Legend -->
  <line x1="40" y1="438" x2="1160" y2="438" stroke="#d8d6d0" stroke-width="1.5" />
  <rect x="40" y="456" width="14" height="14" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <text x="62" y="468" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Parallel model branches</text>
  <rect x="248" y="456" width="14" height="14" rx="6" fill="#fcfbf8" stroke="#207a52" stroke-width="1.5" />
  <text x="270" y="468" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Leakage-safe val threshold</text>
  <rect x="468" y="456" width="14" height="14" rx="6" fill="#fcfbf8" stroke="#a23a3a" stroke-width="1.5" stroke-dasharray="3 2" />
  <text x="490" y="468" font-family="Instrument Sans, system-ui, sans-serif" font-size="14" fill="#666b72">Missing benchmark metrics</text>
</svg>
